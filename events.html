<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speaking · Gülçin's Reading List</title><link rel="stylesheet" href="style.css">
<style>.ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:28px}.up{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--clay);border-radius:12px;padding:16px 18px}.up .d{font:500 12px ui-monospace,monospace;color:var(--clay);text-transform:uppercase}.up .e{font-weight:600;margin:6px 0 2px}.up .e a{color:var(--ink)}.up .c{color:var(--muted);font-size:13px}.up .t{font-family:"Source Serif 4",Georgia,serif;font-size:17px;margin:10px 0 8px}.role{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted);background:var(--soft)}.vl{color:var(--clay);margin-left:8px;font-size:13px}.ptitle{color:var(--muted);font-size:14px}</style></head><body><div class="wrap"><nav class="nav"><a href="index.html">Stats</a><a href="list.html">Reading list</a><a href="books.html">Books</a><a href="writing.html">Writing</a><a href="events.html" class="on">Speaking</a><a href="about.html">About</a></nav>
<h1>Speaking</h1>
<p class="lede" id="cnt">Conference talks, keynotes and community events.</p>
<h2>Upcoming</h2>
<div class="ups" id="up"></div>
<h2>Past</h2>
<div class="box"><ul class="list" id="past"></ul></div>
<footer>Sources: conference schedules &amp; speaker pages</footer></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=d=>!d||d.length<10?(d||""):new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const yy=i=>i.year||(i.date||"").slice(0,4),full=i=>(i.date||"").length==10,today=new Date().toLocaleDateString("sv");
fetch("events.json").then(r=>r.json()).then(d=>{const xs=d.items||[],$=id=>document.getElementById(id);
 const up=xs.filter(i=>full(i)&&i.date>=today).sort((a,b)=>a.date.localeCompare(b.date)),past=xs.filter(i=>!(full(i)&&i.date>=today)).sort((a,b)=>yy(b).localeCompare(yy(a))||(full(b)-full(a))||(b.date||"").localeCompare(a.date||""));
 const cs=new Set(xs.map(i=>i.country).filter(c=>c&&c!="Online")),y0=xs.map(yy).sort()[0];
 $("cnt").textContent=`${xs.length} talks &amp; sessions in ${cs.size} countries since ${y0}`.replace("&amp;","&");
 $("up").innerHTML=up.length?up.map(i=>`<div class="up"><div class="d">${fd(i.date)}</div><div class="e">${i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.event)}</a>`:esc(i.event)}</div><div class="c">${esc([i.city,i.country].filter(Boolean).join(", "))}</div>${i.title?`<div class="t">${esc(i.title)}</div>`:""}<span class="role">${esc(i.role||"")}</span></div>`).join(""):'<p class="dom">Nothing scheduled right now.</p>';
 let last=null;$("past").innerHTML=past.map(i=>{const y=yy(i),h=y!=last?`<li class="yh">${y}</li>`:"";last=y;
  return h+`<li><span><time class="dt">${fd(i.date)}</time>${i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.event)}</a>`:esc(i.event)} <span class="ptitle">· ${esc(i.title||"")}</span>${i.video?`<a class="vl" href="${esc(i.video)}" target="_blank" rel="noopener" title="Watch video">▶</a>`:""}</span><span class="dom">${esc([i.city||i.country,i.role].filter(Boolean).join(" · "))}</span></li>`}).join("");
});
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Books · Gülçin Yıldırım Jelínek</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
<style>
#bookfilt{margin:28px 0 0}
#years.hasfilt .yrgrp:first-child .yr h2{margin-top:16px}
#currevs:empty{display:none}
#currevs:not(:empty){margin-top:18px}
#years li[hidden],#years .yrgrp[hidden],#currevs li[hidden]{display:none !important}
#years li.end{border-bottom:0}
#years li.hasrev,#currevs li.hasrev{flex-wrap:wrap;align-items:baseline}
#years li.hasrev>a,#currevs li.hasrev>a{flex:1 1 auto;min-width:0}
#years li.hasrev>.dom,#currevs li.hasrev>.dom{flex:0 0 auto;margin-left:16px}
#years li.hasrev>.rev,#currevs li.hasrev>.rev{flex:1 0 100%;min-width:0;margin-top:8px}
.rev .stars{display:block;margin:0 0 6px;font-size:13px;letter-spacing:.12em;line-height:1}
.rev .stars .on{color:#1F3F8F}.rev .stars .off{color:#d9d6cc}
.rev .absbody{font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.5;color:var(--ink)}
.rev .abs{margin:0}.rev .abs+.abs{margin-top:.75em}
.rev .absbody.clamp{max-height:6em;overflow:hidden;position:relative}
.rev .absbody.clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.2em;background:linear-gradient(to bottom,rgba(255,255,255,0),var(--card));pointer-events:none}
@media(min-width:601px){.rev .absbody.clamp{max-height:3em}}
.rev .absmore{display:inline-block;margin:6px 0 0;padding:0;border:0;background:none;color:var(--clay);font:500 13px/1.2 Inter,system-ui,sans-serif;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.rev .absmore:focus-visible{outline:2px solid var(--clay);outline-offset:3px;border-radius:2px}
</style></head><body><div class="tileband" aria-hidden="true"></div><div class="wrap"><header class="site"><a class="brand" href="index.html"><svg class="mark" width="20" height="20" aria-hidden="true" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" rx="2" fill="#F7F3EA"/><rect x=".5" y=".5" width="23" height="23" rx="2" fill="none" stroke="#1F3F8F"/><path d="M12 3l2.3 4.4L19 5l-2.4 4.7L21 12l-4.4 2.3L19 19l-4.7-2.4L12 21l-2.3-4.4L5 19l2.4-4.7L3 12l4.4-2.3L5 5l4.7 2.4z" fill="#1F3F8F"/><circle cx="12" cy="12" r="3.2" fill="#F7F3EA"/><circle cx="12" cy="12" r="1.6" fill="#2F7F73"/><g fill="#2F7F73"><path d="M0 0h3.5L0 3.5zM24 0h-3.5L24 3.5zM0 24h3.5L0 20.5zM24 24h-3.5L24 20.5z"/></g></svg>Gülçin Yıldırım Jelínek</a><nav class="nav"><a href="writing.html">Writing</a><a href="events.html">Speaking</a><a href="stats.html" class="on">Reading</a><a href="memories.html">Memories</a><a href="community.html">Community</a><a href="about.html">About</a></nav></header><nav class="subnav"><a href="stats.html">Stats</a><a href="list.html">Reading list</a><a href="books.html" class="on">Books</a></nav>
<h1>Books</h1><p class="lede">What I'm reading and have read, from Goodreads.</p>
<div class="box tiles two"><div class="tile"><div class="lab">Total read</div><div class="n" id="tot"></div><div class="sub" id="yr"></div></div>
<div class="tile"><div class="lab" style="margin-bottom:10px">Books per year</div><div class="bars" id="bars"></div><div class="blab" id="blab"></div></div></div>
<h2>Currently reading</h2><div class="reading" id="cur"></div>
<div id="currevs"></div>
<div class="pills" id="bookfilt" hidden><button type="button" class="on" data-f="all">All</button><button type="button" data-f="reviews">Reviews</button></div>
<div id="years"></div>
<div class="tilediv" aria-hidden="true"></div><footer class="brandfoot"><p class="handle"><svg class="magpie" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5l2.6-.6A4 4 0 0 1 13 9.6l1.8 3.4 6.7 4.6-7.3-1.5A5.5 5.5 0 0 1 7.5 14 4 4 0 0 1 5.6 9"/><path d="M9.4 11.6c1.2 1.3 2.7 1.8 4.4 1.6"/><circle cx="7.7" cy="9.2" r=".6" fill="currentColor"/><path d="M9.5 15.6l-.6 3.4M11.4 16l.2 3"/></svg><a href="https://x.com/apatheticmagpie" rel="me noopener" target="_blank" style="color:inherit">apatheticmagpie</a></p><p class="socrow"><a href="https://x.com/apatheticmagpie" target="_blank" rel="noopener" aria-label="X (@apatheticmagpie)"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.5 4h4l11 16h-4z"/><path d="M19 4l-6 7M5 20l6-7"/></svg></a><a href="https://www.linkedin.com/in/gulcinyildirim" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3.5"/><path d="M8 10.5V17M8 7.2v.1M12 17v-6.5M12 13.5c0-1.8 1.2-3 2.6-3S17 11.4 17 13v4"/></svg></a></p><p class="copy">© <span class="cy">2026</span> Gülçin Yıldırım Jelínek. All rights reserved.</p><script>document.querySelectorAll(".cy").forEach(e=>e.textContent=new Date().getFullYear())</script></footer></div>
<script>
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
fetch("books.json").then(r=>r.json()).then(({books})=>{
 const read=books.filter(b=>b.status=="read"),cur=books.filter(b=>b.status=="reading"),Y=String(new Date().getFullYear());
 const dated=read.filter(b=>!b.read_at_missing).sort((a,b)=>b.read_at.localeCompare(a.read_at)),und=read.filter(b=>b.read_at_missing);
 document.getElementById("tot").textContent=read.length;
 document.getElementById("yr").textContent=`${dated.filter(b=>b.read_at.startsWith(Y)).length} read in ${Y} · ${und.length} undated`;
 const by={};dated.forEach(b=>{const y=b.read_at.slice(0,4);(by[y]=by[y]||[]).push(b)});
 const ys=Object.keys(by).sort(),y0=+ys[0]||+Y,all=[];for(let y=y0;y<=+Y;y++)all.push(String(y));const mx=Math.max(1,...all.map(y=>(by[y]||[]).length));
 document.getElementById("bars").innerHTML=all.map(y=>{const n=(by[y]||[]).length;return`<div><span>${n||""}</span><i style="height:${n/mx*100}%"></i></div>`}).join("");
 document.getElementById("blab").innerHTML=all.map(y=>`<span>'${y.slice(2)}</span>`).join("");
 document.getElementById("cur").innerHTML=cur.map(b=>`<a href="${esc(b.url)}" target="_blank" rel="noopener">${b.cover?`<img src="${esc(b.cover)}" alt="${esc('Cover of '+b.title+(b.domain?' by '+b.domain:''))}" loading="lazy">`:'<div class="ph"></div>'}<div class="t">${esc(b.title)}</div><div class="dom">${esc(b.domain)}</div></a>`).join("")||'<p class="dom">Nothing right now.</p>';
 let ri=0;
 const revBlock=b=>{if(!b.review)return "";const id="rev-"+(ri++);const paras=String(b.review).split(/\n\n+/).filter(s=>s.trim()).map(p=>`<p class="abs">${esc(p).replace(/\n/g,"<br>")}</p>`).join("");const n=+b.rating||0;const stars=n>=1&&n<=5?`<span class="stars" aria-label="Rated ${n} out of 5"><span class="on">${"★".repeat(n)}</span><span class="off">${"★".repeat(5-n)}</span></span>`:"";return `<div class="rev">${stars}<div class="revbox"><div class="absbody clamp" id="${id}">${paras}</div></div></div>`};
 const li=(b,d)=>{const rev=revBlock(b);return `<li${rev?' class="hasrev"':""}><a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.title)}</a><span class="dom">${esc(b.domain)}${d?" · "+fmt(b.read_at):""}</span>${rev}</li>`};
 const grp=(t,xs,d)=>`<div class="yrgrp"><div class="yr"><h2>${t}</h2><span class="lab" data-all="${xs.length} books">${xs.length} books</span></div><div class="box"><ul class="list">${xs.map(b=>li(b,d)).join("")}</ul></div></div>`;
 document.getElementById("years").innerHTML=ys.slice().reverse().map(y=>grp(y,by[y],1)).join("")+(und.length?grp("Undated",und,0):"");
 const crev=cur.filter(b=>b.review);
 document.getElementById("currevs").innerHTML=crev.length?`<div class="box"><ul class="list">${crev.map(b=>li(b,0)).join("")}</ul></div>`:"";
 const filt=document.getElementById("bookfilt");
 if(document.querySelector("#years .hasrev")){filt.hidden=false;document.getElementById("years").classList.add("hasfilt")}
 const apply=f=>{document.querySelectorAll("#years .yrgrp").forEach(g=>{const lis=[...g.querySelectorAll("li")];lis.forEach(li=>{li.hidden=f==="reviews"&&!li.classList.contains("hasrev");li.classList.remove("end")});const shown=lis.filter(li=>!li.hidden);if(shown.length&&shown[shown.length-1]!==lis[lis.length-1])shown[shown.length-1].classList.add("end");g.hidden=!shown.length;const lab=g.querySelector(".lab");lab.textContent=f==="reviews"?`${shown.length} review${shown.length==1?"":"s"}`:lab.dataset.all})};
 filt.onclick=e=>{const f=e.target.dataset.f;if(!f)return;filt.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===e.target));apply(f);fitAbs()};
 const fitAbs=()=>{document.querySelectorAll(".revbox").forEach(box=>{if(!box.offsetParent)return;const body=box.querySelector(".absbody");if(box.querySelector(".absmore")?.getAttribute("aria-expanded")==="true")return;body.classList.add("clamp");const btn=box.querySelector(".absmore");if(body.scrollHeight<=body.clientHeight+1){body.classList.remove("clamp");btn&&btn.remove();return}if(btn)return;const b=document.createElement("button");b.type="button";b.className="absmore";b.setAttribute("aria-expanded","false");b.setAttribute("aria-controls",body.id);b.textContent="Read more";b.addEventListener("click",()=>{const open=!body.classList.toggle("clamp");b.setAttribute("aria-expanded",open?"true":"false");b.textContent=open?"Show less":"Read more"});box.appendChild(b)})};fitAbs();document.fonts.ready.then(fitAbs);let absT;addEventListener("resize",()=>{clearTimeout(absT);absT=setTimeout(()=>document.fonts.ready.then(fitAbs),150)});
});
</script><link rel="stylesheet" href="alt.css"><script src="alt.js" defer></script></body></html>

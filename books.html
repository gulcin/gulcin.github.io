<h1>Books</h1><p class="lede">What I'm reading and have read, from Goodreads.</p>
<div class="box tiles two"><div class="tile"><div class="lab">Total read</div><div class="n" id="tot"></div><div class="sub" id="yr"></div></div>
<div class="tile"><div class="lab" style="margin-bottom:10px">Books per year</div><div class="bars" id="bars"></div><div class="blab" id="blab"></div></div></div>
<h2>Currently reading</h2><div class="reading" id="cur"></div>
<div id="years"></div>
<div class="tilediv" aria-hidden="true"></div><footer class="brandfoot"><p class="handle"><svg class="magpie" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5l2.6-.6A4 4 0 0 1 13 9.6l1.8 3.4 6.7 4.6-7.3-1.5A5.5 5.5 0 0 1 7.5 14 4 4 0 0 1 5.6 9"/><path d="M9.4 11.6c1.2 1.3 2.7 1.8 4.4 1.6"/><circle cx="7.7" cy="9.2" r=".6" fill="currentColor"/><path d="M9.5 15.6l-.6 3.4M11.4 16l.2 3"/></svg><a href="https://x.com/apatheticmagpie" rel="me noopener" target="_blank" style="color:inherit">apatheticmagpie</a></p><p class="socrow"><a href="https://x.com/apatheticmagpie" target="_blank" rel="noopener" aria-label="X (@apatheticmagpie)"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.5 4h4l11 16h-4z"/><path d="M19 4l-6 7M5 20l6-7"/></svg></a><a href="https://www.linkedin.com/in/gulcinyildirim" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3.5"/><path d="M8 10.5V17M8 7.2v.1M12 17v-6.5M12 13.5c0-1.8 1.2-3 2.6-3S17 11.4 17 13v4"/></svg></a></p><p class="copy">© <span class="cy">2026</span> Gülçin Yıldırım Jelínek. All rights reserved.</p><script>document.querySelectorAll(".cy").forEach(e=>e.textContent=new Date().getFullYear())</script></footer></div>
<script>
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
fetch("books.json").then(r=>r.json()).then(({books})=>{
 const read=books.filter(b=>b.status=="read"),cur=books.filter(b=>b.status=="reading"),Y=String(new Date().getFullYear());
 const dated=read.filter(b=>!b.read_at_missing).sort((a,b)=>b.read_at.localeCompare(a.read_at)),und=read.filter(b=>b.read_at_missing);
 document.getElementById("tot").textContent=read.length;
 document.getElementById("yr").textContent=`${dated.filter(b=>b.read_at.startsWith(Y)).length} read in ${Y} · ${und.length} undated`;
 const by={};dated.forEach(b=>{const y=b.read_at.slice(0,4);(by[y]=by[y]||[]).push(b)});
 const ys=Object.keys(by).sort(),y0=+ys[0]||+Y,all=[];for(let y=y0;y<=+Y;y++)all.push(String(y));const mx=Math.max(1,...all.map(y=>(by[y]||[]).length));
 document.getElementById("bars").innerHTML=all.map(y=>{const n=(by[y]||[]).length;return`<div><span>${n||""}</span><i style="height:${n/mx*100}%"></i></div>`}).join("");
 document.getElementById("blab").innerHTML=all.map(y=>`<span>'${y.slice(2)}</span>`).join("");
 document.getElementById("cur").innerHTML=cur.map(b=>`<a href="${esc(b.url)}" target="_blank" rel="noopener">${b.cover?`<img src="${esc(b.cover)}" alt="${esc('Cover of '+b.title+(b.domain?' by '+b.domain:''))}" loading="lazy">`:'<div class="ph"></div>'}<div class="t">${esc(b.title)}</div><div class="dom">${esc(b.domain)}</div></a>`).join("")||'<p class="dom">Nothing right now.</p>';
 const li=(b,d)=>`<li><a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.title)}</a><span class="dom">${esc(b.domain)}${d?" · "+fmt(b.read_at):""}</span></li>`;
 const grp=(t,xs,d)=>`<div class="yr"><h2>${t}</h2><span class="lab">${xs.length} books</span></div><div class="box"><ul class="list">${xs.map(b=>li(b,d)).join("")}</ul></div>`;
 document.getElementById("years").innerHTML=ys.slice().reverse().map(y=>grp(y,by[y],1)).join("")+(und.length?grp("Undated",und,0):"");
});
</script><link rel="stylesheet" href="alt.css"><script src="alt.js" defer></script></body></html>

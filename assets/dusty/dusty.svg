<svg xmlns="http://www.w3.org/2000/svg" class="dusty-svg" viewBox="0 36 800 330" fill="none" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
  <defs>
    <linearGradient id="dy-fur" x1="180" y1="80" x2="500" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D2BFA6"/>
      <stop offset="55%" stop-color="#A58C74"/>
      <stop offset="100%" stop-color="#8C7560"/>
    </linearGradient>
    <linearGradient id="dy-head" x1="500" y1="120" x2="640" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E7D6C0"/>
      <stop offset="60%" stop-color="#B3967C"/>
      <stop offset="100%" stop-color="#8C7560"/>
    </linearGradient>
    <linearGradient id="dy-tail" x1="190" y1="150" x2="70" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A58C74"/>
      <stop offset="60%" stop-color="#5E4E42"/>
      <stop offset="100%" stop-color="#161311"/>
    </linearGradient>
    <linearGradient id="dy-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8F0"/><stop offset="100%" stop-color="#E9D5BE"/>
    </linearGradient>
    <linearGradient id="dy-ear" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#E4B0A2"/><stop offset="100%" stop-color="#F8E0D6"/>
    </linearGradient>
    <linearGradient id="dy-nose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7A198"/><stop offset="100%" stop-color="#B56C62"/>
    </linearGradient>
    <linearGradient id="dy-hat" x1="560" y1="40" x2="640" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#454166"/><stop offset="100%" stop-color="#1B1830"/>
    </linearGradient>
    <filter id="dy-ground" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="dy-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.7"/></filter>
    <ellipse id="dy-hip" cx="214" cy="188" rx="86" ry="76"/>
    <ellipse id="dy-rib" cx="392" cy="196" rx="150" ry="60"/>
    <ellipse id="dy-chst" cx="500" cy="214" rx="58" ry="50"/>
    <clipPath id="dy-bodyclip">

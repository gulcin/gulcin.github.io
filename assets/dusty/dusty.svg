  <g class="hearts" opacity="0">
    <path class="heart" d="M10 18C10 18 1 12 1 7C1 3.5 3.8 1.5 6.6 4.2C7.6 5.2 8.6 6.4 8.6 6.4C8.6 6.4 9.6 5.2 10.6 4.2C13.4 1.5 16.2 3.5 16.2 7C16.2 12 10 18 10 18Z" transform="translate(340 64)" stroke="#2F7F73" stroke-width="1.7"/>
    <path class="heart" d="M10 18C10 18 1 12 1 7C1 3.5 3.8 1.5 6.6 4.2C7.6 5.2 8.6 6.4 8.6 6.4C8.6 6.4 9.6 5.2 10.6 4.2C13.4 1.5 16.2 3.5 16.2 7C16.2 12 10 18 10 18Z" transform="translate(392 40)" stroke="#1F3F8F" stroke-width="1.7"/>
    <path class="heart" d="M10 18C10 18 1 12 1 7C1 3.5 3.8 1.5 6.6 4.2C7.6 5.2 8.6 6.4 8.6 6.4C8.6 6.4 9.6 5.2 10.6 4.2C13.4 1.5 16.2 3.5 16.2 7C16.2 12 10 18 10 18Z" transform="translate(292 88)" stroke="#2F7F73" stroke-width="1.7"/>

      <path d="M538 226C492 230 448 242 412 252"/>
      <path d="M544 234C500 246 462 264 430 278"/>
      <path d="M594 214C634 206 668 198 696 192"/>
      <path d="M596 222C638 226 672 236 700 244"/>
      <path d="M590 230C630 242 662 258 686 270"/>
    </g>

      <path d="M534 244C572 256 620 254 646 238" stroke="#F6F1EA" stroke-width="4.5"/>
      <path d="M636 242C654 264 658 298 644 326C632 310 630 280 622 258Z" fill="#C23A3C"/>
      <path d="M640 272C650 286 650 304 642 316" stroke="#F6F1EA" stroke-width="3.6"/>

        <path d="M574 196C588 176 600 176 612 196" stroke="#241C18" stroke-width="2.7"/>
      </g>
    </g>

    <g class="costume-halloween costume-part" opacity="0">
      <ellipse cx="572" cy="150" rx="68" ry="15" fill="#221C36"/>
      <path d="M508 148C540 134 612 132 640 146C634 162 600 172 572 172C540 172 514 162 508 148Z" fill="#2F7F73"/>
      <path d="M548 148H600" stroke="#1F3F8F" stroke-width="1.6" opacity=".75"/>
      <rect x="564" y="142" width="16" height="11" rx="1.5" fill="none" stroke="#F0E0AE" stroke-width="1.3"/>

      <path d="M522 154C556 140 610 142 634 158" stroke="#F6F1EA" stroke-width="6.5"/>
      <path d="M512 176C530 196 578 204 636 180C628 168 584 178 556 174C532 170 518 172 512 176Z" fill="#9E2E32"/>
      <circle cx="608" cy="100" r="11" fill="#F6F1EA"/>
      <path d="M540 116C544 126 542 134 536 138" stroke="#9E2E32" stroke-width="1" opacity=".4"/>

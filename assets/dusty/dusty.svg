      <path d="M156 150C146 176 150 206 168 230C178 222 178 190 174 164C170 150 164 146 156 150Z"/>
      <path d="M188 132C176 162 178 198 196 230C208 220 210 184 204 152C200 136 196 128 188 132Z"/>
      <path d="M224 128C214 160 218 200 236 236C248 226 250 186 244 152C240 134 234 124 224 128Z"/>
      <!-- barrel bands, narrow and tapered -->
      <path d="M270 140C262 168 258 202 274 234C286 226 292 196 290 164C288 146 282 138 270 140Z"/>
      <path d="M322 136C314 166 310 202 328 238C342 228 348 196 344 160C342 142 334 134 322 136Z"/>
      <path d="M374 136C366 168 364 204 384 238C398 228 404 194 398 158C396 140 386 134 374 136Z"/>
      <path d="M428 142C422 170 422 202 440 232C454 222 458 190 450 160C446 144 438 138 428 142Z"/>
      <path d="M476 154C472 176 476 202 492 222C504 214 506 186 498 164C494 152 486 150 476 154Z"/>
      <path d="M160 146C250 116 420 114 530 152C518 164 400 144 270 150C210 154 176 152 160 146Z" opacity=".45"/>
    </g>
    <path d="M468 200C446 218 448 252 482 264C516 274 548 256 546 226C544 202 516 186 484 190C476 192 472 196 468 200Z" fill="url(#dy-cream)" clip-path="url(#dy-bodyclip)"/>
  </g>


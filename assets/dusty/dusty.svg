      C70 316 82 362 112 374
      C134 368 136 330 132 294
      C128 252 146 216 178 202
      C192 196 174 182 158 188Z" fill="url(#dy-tail)"/>
    <g fill="#1A1614">
      <path d="M124 214C108 230 96 250 94 270C110 262 126 242 138 224C132 216 128 214 124 214Z"/>
      <path d="M96 276C86 296 88 316 102 332C118 322 126 302 128 282C118 274 106 272 96 276Z"/>
      <path d="M92 336C90 352 100 368 118 370C130 360 130 344 122 330C112 324 100 326 92 336Z"/>
    </g>
    <path d="M96 352C94 366 106 378 120 372C130 364 128 352 118 346C110 342 100 344 96 352Z" fill="#100E0C"/>
    <path d="M150 194C124 206 100 232 90 262" stroke="#F6E6D0" stroke-width="2.2" opacity=".4"/>
  </g>

  <!-- hind paw, top tucked behind the hip -->
  <g class="dusty-hind">
    <path d="M214 236C176 248 158 272 172 294C186 312 230 314 246 294C258 278 248 252 228 242C220 236 216 234 214 236Z" fill="#A58C74" stroke="#3A312A" stroke-width="1.6"/>

    <g stroke="#241C18" fill="none">
      <path d="M536 158Q552 140 566 160Q580 140 598 160" stroke-width="3.2"/>
      <path d="M566 158V176" stroke-width="2.2"/>
      <path d="M522 186Q540 178 552 188" stroke-width="2"/>
      <path d="M586 182Q604 174 616 186" stroke-width="1.9"/>
      <path d="M516 204Q536 196 550 208" stroke-width="2"/>
      <path d="M514 216Q534 210 550 220" stroke-width="1.8"/>
      <path d="M586 202Q606 196 620 208" stroke-width="1.9"/>
      <path d="M590 214Q608 208 622 220" stroke-width="1.7"/>
    </g>
    <ellipse cx="566" cy="222" rx="30" ry="20" fill="url(#dy-cream)"/>
    <path d="M558 208C548 208 546 218 554 226C562 232 576 228 578 218C580 210 570 206 558 208Z" fill="url(#dy-nose)"/>
    <path d="M554 212C560 210 568 210 572 214" stroke="#FBECEA" stroke-width="1.1" opacity=".8"/>
    <path d="M566 226C560 234 550 236 544 232" stroke="#8A645C" stroke-width="1.15"/>
    <path d="M566 226C574 234 586 234 592 228" stroke="#8A645C" stroke-width="1.15"/>
    <g stroke="#F7F4EE" stroke-width="1.15" fill="none">

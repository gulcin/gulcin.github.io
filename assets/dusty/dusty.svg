    <ellipse cx="390" cy="226" rx="146" ry="36" fill="#4A3C32" opacity=".22" clip-path="url(#dy-bodyclip)"/>
    <ellipse cx="200" cy="210" rx="60" ry="40" fill="#3A302A" opacity=".18" clip-path="url(#dy-bodyclip)"/>
    <!-- warm light on the back -->
    <ellipse cx="360" cy="158" rx="120" ry="22" fill="#F4E4CE" opacity=".55" clip-path="url(#dy-bodyclip)"/>
    <path d="M160 150C240 112 400 108 520 150" stroke="#FFF0DC" stroke-width="3" opacity=".7" filter="url(#dy-soft)" clip-path="url(#dy-bodyclip)"/>

    <g clip-path="url(#dy-bodyclip)" fill="#241C18">

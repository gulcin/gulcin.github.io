      <ellipse cx="536" cy="362" rx="8.4" ry="6.4"/>
      <ellipse cx="552" cy="354" rx="7.8" ry="6"/>
    </g>
  </g>

  <g class="dusty-torso">
    <!-- outline pass, then fill pass covers interior seams -->
    <g fill="url(#dy-fur)" stroke="#3A312A" stroke-width="3.4">
      <use href="#dy-hip"/><use href="#dy-rib"/><use href="#dy-chst"/>
    </g>
    <g fill="url(#dy-fur)">

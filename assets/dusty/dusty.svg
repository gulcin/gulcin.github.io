    <path d="M456 332C452 344 464 354 478 350C490 346 494 334 484 326C476 320 462 324 456 332Z" fill="#1C1816"/>
    <path d="M462 328C468 326 476 326 482 330" stroke="#6A5048" stroke-width="1.15" opacity=".5"/>
    <g class="toes">
      <ellipse class="toe" cx="446" cy="310" rx="6.2" ry="7.8" fill="#1C1816"/>
      <ellipse class="toe" cx="460" cy="304" rx="6.4" ry="8" fill="#1C1816"/>
      <ellipse class="toe" cx="476" cy="304" rx="6.4" ry="8" fill="#1C1816"/>
      <ellipse class="toe" cx="490" cy="312" rx="5.8" ry="7.4" fill="#1C1816"/>
    </g>
  </g>


    </clipPath>
    <clipPath id="dy-headclip">
      <ellipse cx="568" cy="196" rx="56" ry="50"/>
    </clipPath>
  </defs>

  <ellipse cx="390" cy="268" rx="200" ry="13" fill="#141413" opacity=".12" filter="url(#dy-ground)"/>


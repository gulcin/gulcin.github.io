    </g>
  </g>

  <!-- dangling foreleg, shoulder hidden by the chest -->
  <g class="dusty-fore-hang">
    <path d="M548 210C568 248 572 300 556 342C548 360 524 364 518 346C512 328 524 292 526 256C528 230 534 208 548 210Z" fill="#A58C74" stroke="#3A312A" stroke-width="1.6"/>
    <g fill="#241C18">

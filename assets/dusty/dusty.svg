<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 230" role="img" aria-label="Dusty, a cool grey-brown mackerel tabby">
  <defs>
    <linearGradient id="dusty-body" x1="18%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#d4c7b8"/>
      <stop offset="42%" stop-color="#9b8d80"/>
      <stop offset="100%" stop-color="#7d8488"/>
    </linearGradient>
    <linearGradient id="dusty-head" x1="10%" y1="0%" x2="90%" y2="100%">

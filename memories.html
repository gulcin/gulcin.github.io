<footer>Photos from my own collection · <a href="events.html">All talks</a></footer><div class="tilediv" aria-hidden="true"></div><footer class="brandfoot"><p class="motto">“It doesn't matter what you create if you have no fun!”</p><p class="handle"><svg class="magpie" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5l2.6-.6A4 4 0 0 1 13 9.6l1.8 3.4 6.7 4.6-7.3-1.5A5.5 5.5 0 0 1 7.5 14 4 4 0 0 1 5.6 9"/><path d="M9.4 11.6c1.2 1.3 2.7 1.8 4.4 1.6"/><circle cx="7.7" cy="9.2" r=".6" fill="currentColor"/><path d="M9.5 15.6l-.6 3.4M11.4 16l.2 3"/></svg><span>apatheticmagpie</span></p><p class="socrow"><a href="https://x.com/apatheticmagpie" target="_blank" rel="noopener" aria-label="X (@apatheticmagpie)"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.5 4h4l11 16h-4z"/><path d="M19 4l-6 7M5 20l6-7"/></svg></a><a href="https://www.linkedin.com/in/gulcinyildirim" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3.5"/><path d="M8 10.5V17M8 7.2v.1M12 17v-6.5M12 13.5c0-1.8 1.2-3 2.6-3S17 11.4 17 13v4"/></svg></a></p></footer></div>
<div id="lb"><img alt=""><p></p></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=d=>(d||"").length<10?(d||""):new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
fetch("memories.json").then(r=>r.json()).then(d=>{const xs=(d.items||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)),gs=[];
 xs.forEach(i=>{let g=gs.find(g=>g.e==i.event);if(!g)gs.push(g={e:i.event,d:i.date,xs:[]});g.xs.push(i)});
 document.getElementById("g").innerHTML=gs.map(g=>`<div class="gh"><h2>${esc(g.e)}</h2><span class="dom">${fd(g.d)}</span></div><div class="mgrid">${g.xs.map(i=>`<figure class="ph"><img src="${esc(i.thumb)}" data-full="${esc(i.file)}" alt="${esc(i.caption)}" loading="lazy"><figcaption>${esc(i.caption)}${i.link?` · <a href="${esc(i.link)}" target="_blank" rel="noopener">more</a>`:""}</figcaption></figure>`).join("")}</div>`).join("");
 const lb=document.getElementById("lb");
 document.querySelectorAll(".ph img").forEach(im=>im.onclick=()=>{lb.querySelector("img").src=im.dataset.full;lb.querySelector("p").textContent=im.alt;lb.classList.add("on")});
 lb.onclick=()=>lb.classList.remove("on");document.onkeydown=e=>{if(e.key=="Escape")lb.classList.remove("on")};
});
</script></body></html>

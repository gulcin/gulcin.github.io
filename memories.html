<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memories · Gülçin Yıldırım Jelínek</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
<style>.mgrid{columns:3 220px;column-gap:14px;margin-bottom:28px}.ph{break-inside:avoid;margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.ph img{display:block;width:100%;height:auto;cursor:zoom-in}.ph figcaption{padding:10px 14px;font-size:14px;color:var(--muted)}.ph figcaption a{color:var(--clay)}.gh{display:flex;justify-content:space-between;align-items:baseline}.gh .dom{font:500 12px ui-monospace,monospace;color:var(--clay);text-transform:uppercase}
#lb{position:fixed;inset:0;background:rgba(20,20,19,.88);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:9;cursor:zoom-out;padding:24px}#lb.on{display:flex}#lb img{max-width:92vw;max-height:84vh;border-radius:8px}#lb p{color:#f0eee6;margin:12px 0 0;font-size:14px}.alb{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;margin:0 0 30px}
.acard{all:unset;box-sizing:border-box;cursor:pointer;display:block;position:relative;max-width:100%}
.acard .stk{position:relative;aspect-ratio:4/3;margin:8px 8px 0}
.acard .stk::before,.acard .stk::after{content:"";position:absolute;inset:0;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.acard .stk::before{transform:rotate(-3deg) translate(-4px,2px);background:#e8edf7}.acard .stk::after{transform:rotate(2.5deg) translate(4px,-2px);background:#e6f1ef}
.acard img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:12px;border:3px solid #fff;box-sizing:border-box;box-shadow:0 2px 10px rgba(20,20,19,.12)}
.acard .cnt{position:absolute;z-index:2;right:10px;bottom:10px;background:#1F3F8F;color:#fff;font:600 12px ui-monospace,monospace;padding:4px 8px;border-radius:999px}
.acard h3{margin:14px 8px 2px;font-size:17px;color:var(--ink)}.acard .ad{margin:0 8px;font:500 12px ui-monospace,monospace;color:#2F7F73;text-transform:uppercase}
.acard:hover img,.acard:focus-visible img{outline:3px solid #2F7F73;outline-offset:2px}
#av{display:none}#av.on{display:block}.avh{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 16px}.avh h2{margin:0;flex:1 1 200px}
.btn{font:inherit;font-size:14px;border:1px solid #1F3F8F;color:#1F3F8F;background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}.btn:hover,.btn:focus-visible{background:#1F3F8F;color:#fff}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.tg button{all:unset;cursor:pointer;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--soft)}
.tg img{width:100%;height:100%;object-fit:cover;display:block}.tg button:focus-visible{outline:3px solid #2F7F73;outline-offset:2px}
@media(max-width:480px){.avh h2{flex:1 1 100%;font-size:26px}.tg{grid-template-columns:repeat(3,1fr);gap:4px}.alb{grid-template-columns:1fr}}
#lb .lc{position:absolute;top:14px;left:18px;color:#f0eee6;font:500 13px ui-monospace,monospace}
#lb .lx,#lb .lp,#lb .ln{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;width:44px;height:44px;font-size:22px;cursor:pointer;line-height:1}
#lb .lx{top:10px;right:12px}#lb .lp{left:12px;top:50%;transform:translateY(-50%)}#lb .ln{right:12px;top:50%;transform:translateY(-50%)}
#lb button:hover,#lb button:focus-visible{background:#2F7F73;outline:2px solid #fff}#lb{cursor:default}
@media(max-width:600px){#lb .lp,#lb .ln{top:auto;bottom:14px;transform:none}#lb img{max-width:96vw;max-height:74vh}}
.acard .az{position:relative;margin:10px 10px 0;padding:11px;background:#F7F3EA url(favicon.svg) repeat 0 0/11px 11px;border:1px solid #1F3F8F;border-radius:3px}
.acard .azi{aspect-ratio:4/3;background:#fff;padding:3px}.acard .azi img{border:0;border-radius:1px;box-shadow:none}
.acard .azm{position:absolute;z-index:2;left:-10px;top:-10px;width:26px;height:26px;background:#F7F3EA url(favicon.svg) center/22px no-repeat;border:1px solid #1F3F8F}
.acard .azc{position:absolute;z-index:2;right:-9px;bottom:-9px;width:48px;height:48px;box-sizing:border-box;background:#1F3F8F;color:#fff;border:3px solid #F7F3EA;box-shadow:0 0 0 1px #1F3F8F;display:flex;flex-direction:column;align-items:center;justify-content:center;font:500 8px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;line-height:1.1}
.acard .azc b{font-size:16px;letter-spacing:0}
.acard h3{margin-top:16px;font-family:"Source Serif 4",Georgia,serif;font-weight:500;font-size:18px}.acard:hover .azi img,.acard:focus-visible .azi img{outline:none}.acard:hover .az,.acard:focus-visible .az{box-shadow:0 0 0 3px #2F7F73}
.avh .azh{flex:1 1 280px;display:flex;gap:12px;align-items:center;padding:10px 14px;border:6px solid transparent;background:linear-gradient(#fff,#fff) padding-box,url(favicon.svg) 0 0/10px 10px border-box;outline:1px solid #1F3F8F;min-width:0}
.avh .azh h2{margin:0;flex:none}.avh .azt{width:30px;height:30px;flex:none;background:url(favicon.svg) center/30px no-repeat}
@media(max-width:480px){.avh .azh{flex-basis:100%}.avh .azh h2{font-size:22px}}
</style></head><body><div class="tileband" aria-hidden="true"></div><div class="wrap"><header class="site"><a class="brand" href="index.html"><svg class="mark" width="20" height="20" aria-hidden="true" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" rx="2" fill="#F7F3EA"/><rect x=".5" y=".5" width="23" height="23" rx="2" fill="none" stroke="#1F3F8F"/><path d="M12 3l2.3 4.4L19 5l-2.4 4.7L21 12l-4.4 2.3L19 19l-4.7-2.4L12 21l-2.3-4.4L5 19l2.4-4.7L3 12l4.4-2.3L5 5l4.7 2.4z" fill="#1F3F8F"/><circle cx="12" cy="12" r="3.2" fill="#F7F3EA"/><circle cx="12" cy="12" r="1.6" fill="#2F7F73"/><g fill="#2F7F73"><path d="M0 0h3.5L0 3.5zM24 0h-3.5L24 3.5zM0 24h3.5L0 20.5zM24 24h-3.5L24 20.5z"/></g></svg>Gülçin Yıldırım Jelínek</a><nav class="nav"><a href="writing.html">Writing</a><a href="events.html">Speaking</a><a href="stats.html">Reading</a><a href="memories.html" class="on">Memories</a><a href="about.html">About</a></nav></header>
<h1>Memories</h1>
<p class="lede">Moments from conferences, meetups and talks.</p>
<div id="g"></div>
<footer>Photos are shared for personal viewing. Please don't reuse them without permission. · <a href="events.html">All talks</a></footer><div class="tilediv" aria-hidden="true"></div><footer class="brandfoot"><p class="handle"><svg class="magpie" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5l2.6-.6A4 4 0 0 1 13 9.6l1.8 3.4 6.7 4.6-7.3-1.5A5.5 5.5 0 0 1 7.5 14 4 4 0 0 1 5.6 9"/><path d="M9.4 11.6c1.2 1.3 2.7 1.8 4.4 1.6"/><circle cx="7.7" cy="9.2" r=".6" fill="currentColor"/><path d="M9.5 15.6l-.6 3.4M11.4 16l.2 3"/></svg><a href="https://x.com/apatheticmagpie" rel="me noopener" target="_blank" style="color:inherit">apatheticmagpie</a></p><p class="socrow"><a href="https://x.com/apatheticmagpie" target="_blank" rel="noopener" aria-label="X (@apatheticmagpie)"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.5 4h4l11 16h-4z"/><path d="M19 4l-6 7M5 20l6-7"/></svg></a><a href="https://www.linkedin.com/in/gulcinyildirim" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3.5"/><path d="M8 10.5V17M8 7.2v.1M12 17v-6.5M12 13.5c0-1.8 1.2-3 2.6-3S17 11.4 17 13v4"/></svg></a></p><p class="copy">© <span class="cy">2026</span> Gülçin Yıldırım Jelínek. All rights reserved.</p><script>document.querySelectorAll(".cy").forEach(e=>e.textContent=new Date().getFullYear())</script></footer></div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer"><span class="lc" aria-live="polite"></span><button class="lx" aria-label="Close">×</button><button class="lp" aria-label="Previous photo">‹</button><img alt=""><p></p><button class="ln" aria-label="Next photo">›</button></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=d=>(d||"").length<10?(d||""):new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const slug=s=>String(s).toLowerCase().normalize("NFD").replace(/[^\w\s-]/g,"").trim().replace(/[\s_]+/g,"-");
const G=document.getElementById("g"),lb=document.getElementById("lb"),li=lb.querySelector("img"),lp=lb.querySelector("p"),lc=lb.querySelector(".lc");
let gs=[],cur=[],ix=0,ret=null;
function show(){const i=cur[ix];li.src=i.file;li.alt=i.caption;lp.textContent=i.caption;lc.textContent=(ix+1)+" / "+cur.length;[cur[ix+1],cur[ix-1]].forEach(n=>{if(n)new Image().src=n.file})}
function openLb(list,k){cur=list;ix=k;ret=document.activeElement;show();lb.classList.add("on");lb.querySelector(".lx").focus()}
function closeLb(){lb.classList.remove("on");li.removeAttribute("src");if(ret)ret.focus()}
const step=n=>{ix=(ix+n+cur.length)%cur.length;show()};
lb.querySelector(".lx").onclick=closeLb;lb.querySelector(".lp").onclick=()=>step(-1);lb.querySelector(".ln").onclick=()=>step(1);
lb.onclick=e=>{if(e.target===lb)closeLb()};
let tx=null;lb.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
lb.addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)step(dx<0?1:-1);tx=null});
document.addEventListener("keydown",e=>{if(lb.classList.contains("on")){if(e.key=="Escape")closeLb();else if(e.key=="ArrowRight")step(1);else if(e.key=="ArrowLeft")step(-1);else if(e.key=="Tab"){const b=[...lb.querySelectorAll("button")],f=b.indexOf(document.activeElement);e.preventDefault();b[(f+(e.shiftKey?-1:1)+b.length)%b.length].focus()}}else if(e.key=="Escape"&&location.hash)location.hash=""});
function grid(){
 let h="",alb=[];const flush=()=>{if(alb.length){h+=`<div class="alb">${alb.join("")}</div>`;alb=[]}};
 gs.forEach(g=>{const n=g.xs.length;
  if(n>3){alb.push(`<button class="acard" data-a="${esc(g.id)}" aria-label="Open album: ${esc(g.e)}, ${n} photos"><div class="az"><span class="azm" aria-hidden="true"></span><div class="azi"><img src="${esc(g.xs[0].thumb)}" alt="" loading="lazy"></div><span class="azc"><b>${n}</b>${n==1?"photo":"photos"}</span></div><h3>${esc(g.e)}</h3><p class="ad">${fd(g.d)}</p></button>`)}
  else{flush();h+=`<div class="gh"><h2>${esc(g.e)}</h2><span class="dom">${fd(g.d)}</span></div><div class="mgrid">${g.xs.map((i,k)=>`<figure class="ph"><img src="${esc(i.thumb)}" data-g="${esc(g.id)}" data-k="${k}" alt="${esc(i.caption)}" loading="lazy" tabindex="0" role="button" aria-label="View photo: ${esc(i.caption)}"><figcaption>${esc(i.caption)}${i.link?` · <a href="${esc(i.link)}" target="_blank" rel="noopener">more</a>`:""}</figcaption></figure>`).join("")}</div>`}});
 flush();return h}
function album(g){const l=g.xs[0].link;return `<section id="av" class="on" aria-label="${esc(g.e)} album"><div class="avh"><button class="btn back" aria-label="Back to all memories">← All memories</button><div class="azh"><span class="azt" aria-hidden="true"></span><div><h2>${esc(g.e)}</h2><span class="dom">${fd(g.d)} · ${g.xs.length} photos${l?` · <a href="${esc(l)}" target="_blank" rel="noopener">event</a>`:""}</span></div></div></div><div class="tg">${g.xs.map((i,k)=>`<button data-g="${esc(g.id)}" data-k="${k}" aria-label="View photo ${k+1} of ${g.xs.length}: ${esc(i.caption)}"><img src="${esc(i.thumb)}" alt="${esc(i.caption)}" loading="lazy"></button>`).join("")}</div></section>`}
function route(){const id=decodeURIComponent(location.hash.slice(1)),g=gs.find(g=>g.id==id&&g.xs.length>3);
 G.innerHTML=g?album(g):grid();if(g)scrollTo(0,0);
 G.querySelectorAll(".acard").forEach(b=>b.onclick=()=>location.hash=b.dataset.a);
 const bk=G.querySelector(".back");if(bk){bk.onclick=()=>{location.hash=""};bk.focus({preventScroll:true})}
 G.querySelectorAll("[data-k]").forEach(el=>{const go=()=>openLb(gs.find(g=>g.id==el.dataset.g).xs,+el.dataset.k);el.onclick=go;el.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();go()}}});
 if(!g&&id){const t=G.querySelector(`[data-a="${CSS.escape(id)}"]`);if(t)t.focus()}}
fetch("memories.json").then(r=>r.json()).then(d=>{const xs=(d.items||[]).map((i,o)=>({...i,o})).sort((a,b)=>b.date.localeCompare(a.date)||a.o-b.o);
 xs.forEach(i=>{let g=gs.find(g=>g.e==i.event);if(!g)gs.push(g={e:i.event,d:i.date,id:i.album||slug(i.event),xs:[]});g.xs.push(i)});
 addEventListener("hashchange",route);route()});
</script></body></html>

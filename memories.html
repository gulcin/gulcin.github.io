<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memories · Gülçin Yıldırım Jelínek</title><link rel="stylesheet" href="style.css">
<style>.mgrid{columns:3 220px;column-gap:14px;margin-bottom:28px}.ph{break-inside:avoid;margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.ph img{display:block;width:100%;height:auto;cursor:zoom-in}.ph figcaption{padding:10px 14px;font-size:14px;color:var(--muted)}.ph figcaption a{color:var(--clay)}.gh{display:flex;justify-content:space-between;align-items:baseline}.gh .dom{font:500 12px ui-monospace,monospace;color:var(--clay);text-transform:uppercase}
#lb{position:fixed;inset:0;background:rgba(20,20,19,.88);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:9;cursor:zoom-out;padding:24px}#lb.on{display:flex}#lb img{max-width:92vw;max-height:84vh;border-radius:8px}#lb p{color:#f0eee6;margin:12px 0 0;font-size:14px}</style></head><body><div class="wrap"><header class="site"><a class="brand" href="index.html">Gülçin Yıldırım Jelínek</a><nav class="nav"><a href="writing.html">Writing</a><a href="events.html">Speaking</a><a href="stats.html">Reading</a><a href="memories.html" class="on">Memories</a><a href="about.html">About</a></nav></header>
<h1>Memories</h1>
<p class="lede">Moments from conferences, meetups and talks.</p>
<div id="g"></div>
<footer>Photos from my own collection · <a href="events.html">All talks</a></footer></div>
<div id="lb"><img alt=""><p></p></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=d=>(d||"").length<10?(d||""):new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
fetch("memories.json").then(r=>r.json()).then(d=>{const xs=(d.items||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)),gs=[];
 xs.forEach(i=>{let g=gs.find(g=>g.e==i.event);if(!g)gs.push(g={e:i.event,d:i.date,xs:[]});g.xs.push(i)});
 document.getElementById("g").innerHTML=gs.map(g=>`<div class="gh"><h2>${esc(g.e)}</h2><span class="dom">${fd(g.d)}</span></div><div class="mgrid">${g.xs.map(i=>`<figure class="ph"><img src="${esc(i.thumb)}" data-full="${esc(i.file)}" alt="${esc(i.caption)}" loading="lazy"><figcaption>${esc(i.caption)}${i.link?` · <a href="${esc(i.link)}" target="_blank" rel="noopener">more</a>`:""}</figcaption></figure>`).join("")}</div>`).join("");
 const lb=document.getElementById("lb");
 document.querySelectorAll(".ph img").forEach(im=>im.onclick=()=>{lb.querySelector("img").src=im.dataset.full;lb.querySelector("p").textContent=im.alt;lb.classList.add("on")});
 lb.onclick=()=>lb.classList.remove("on");document.onkeydown=e=>{if(e.key=="Escape")lb.classList.remove("on")};
});
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Writing · Gülçin Yıldırım Jelínek</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><style>ul.list li a.feat{display:inline-block;margin-left:8px;font:500 11px ui-monospace,monospace;color:var(--clay);border:1px solid var(--clay);border-radius:999px;padding:1px 8px;vertical-align:middle}</style></head><body><div class="tileband" aria-hidden="true"></div><div class="wrap"><header class="site"><a class="brand" href="index.html"><svg class="mark" width="20" height="20" aria-hidden="true" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" rx="2" fill="#F7F3EA"/><rect x=".5" y=".5" width="23" height="23" rx="2" fill="none" stroke="#1F3F8F"/><path d="M12 3l2.3 4.4L19 5l-2.4 4.7L21 12l-4.4 2.3L19 19l-4.7-2.4L12 21l-2.3-4.4L5 19l2.4-4.7L3 12l4.4-2.3L5 5l4.7 2.4z" fill="#1F3F8F"/><circle cx="12" cy="12" r="3.2" fill="#F7F3EA"/><circle cx="12" cy="12" r="1.6" fill="#2F7F73"/><g fill="#2F7F73"><path d="M0 0h3.5L0 3.5zM24 0h-3.5L24 3.5zM0 24h3.5L0 20.5zM24 24h-3.5L24 20.5z"/></g></svg>Gülçin Yıldırım Jelínek</a><nav class="nav"><a href="writing.html" class="on">Writing</a><a href="events.html">Speaking</a><a href="stats.html">Reading</a><a href="memories.html">Memories</a><a href="about.html">About</a></nav></header>
<h1>Writing</h1>
<p class="lede">Articles I've written, talks and podcasts I've done, and places I've been mentioned.</p>
<p class="dom" id="pwk"></p>
<h2>Articles</h2>
<input id="q" class="search" type="search" placeholder="Search titles, publishers, tags…" autocomplete="off">
<div class="pills" id="tags"></div>
<div class="box"><ul class="list" id="arts"></ul></div>
<h2>Talks &amp; podcasts</h2>
<div class="pills" id="kinds"></div>
<div class="vids" id="vids"></div>
<h2>Mentions</h2>
<div class="box"><ul class="list" id="ments"></ul></div>
<footer><span id="upd"></span></footer><div class="tilediv" aria-hidden="true"></div><footer class="brandfoot"><p class="motto">“It doesn't matter what you create if you have no fun!”</p><p class="handle"><svg class="magpie" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5l2.6-.6A4 4 0 0 1 13 9.6l1.8 3.4 6.7 4.6-7.3-1.5A5.5 5.5 0 0 1 7.5 14 4 4 0 0 1 5.6 9"/><path d="M9.4 11.6c1.2 1.3 2.7 1.8 4.4 1.6"/><circle cx="7.7" cy="9.2" r=".6" fill="currentColor"/><path d="M9.5 15.6l-.6 3.4M11.4 16l.2 3"/></svg><span>apatheticmagpie</span></p></footer></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=d=>d?new Date(d+(d.length==10?"T00:00:00":"")).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"";
const yr=d=>d?d.slice(0,4):"Undated",byDate=(a,b)=>(b.date||"").localeCompare(a.date||"");
const get=f=>fetch(f).then(r=>r.json()).then(d=>(d.items||[]).slice().sort(byDate)).catch(()=>[]);
const KL={talk:"Talks",podcast:"Podcasts",interview:"Interviews"};
Promise.all([get("writing.json"),get("videos.json"),get("mentions.json")]).then(([ws,vs,ms])=>{
 let tag="",kind="";{const n=ws.filter(i=>(i.featured||[]).some(f=>f.name=="Postgres Weekly")).length;if(n)document.getElementById("pwk").innerHTML=`<a href="https://postgresweekly.com/" target="_blank" rel="noopener" style="color:var(--clay)">${n} posts featured in Postgres Weekly</a>`;}const $=id=>document.getElementById(id);
 const pills=(el,xs,key,cur,lab=k=>k)=>{const c={};xs.forEach(i=>{const k=i[key]||"Other";c[k]=(c[k]||0)+1});
  el.innerHTML=`<button class="${cur?"":"on"}" data-k="">All (${xs.length})</button>`+Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<button class="${k==cur?"on":""}" data-k="${esc(k)}">${esc(lab(k))} (${n})</button>`).join("")};
 function arts(){const c={};ws.forEach(i=>(i.tags||[]).forEach(t=>c[t]=(c[t]||0)+1));
  $("tags").innerHTML=`<button class="${tag?"":"on"}" data-k="">All (${ws.length})</button>`+Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<button class="${k==tag?"on":""}" data-k="${esc(k)}">${esc(k)} (${n})</button>`).join("");
  const q=$("q").value.trim().toLowerCase();
  const xs=ws.filter(i=>(!tag||(i.tags||[]).includes(tag))&&(!q||[i.title,i.publisher,(i.tags||[]).join(" ")].join(" ").toLowerCase().includes(q)));let last=null;
  $("arts").innerHTML=xs.length?xs.map(i=>{const y=yr(i.date),h=y!=last?`<li class="yh">${y}</li>`:"";last=y;
   return h+`<li><span><time class="dt">${fd(i.date)}</time><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>${(i.tags||[]).map(t=>`<button class="tag" data-t="${esc(t)}">${esc(t)}</button>`).join("")}${(i.featured||[]).map(f=>`<a class="feat" href="${esc(f.url)}" target="_blank" rel="noopener">Featured in ${esc(f.name)} #${esc(f.issue)}</a>`).join("")}</span><span class="dom">${esc(i.publisher)}</span></li>`}).join(""):'<li class="dom">Nothing here yet.</li>';}
 function vids(){pills($("kinds"),vs,"kind",kind,k=>KL[k]||k);const xs=vs.filter(i=>!kind||(i.kind||"Other")==kind);
  $("vids").innerHTML=xs.length?xs.map(i=>`<a href="${esc(i.url)}" target="_blank" rel="noopener">${i.thumbnail?`<img src="${esc(i.thumbnail)}" alt="" loading="lazy">`:""}<div class="vb"><div class="t">${esc(i.title)}</div><div class="dom">${esc(i.event||i.channel)}${i.date?" · "+i.date.slice(0,4):""}</div></div></a>`).join(""):'<p class="dom">Nothing here yet.</p>';}
 $("ments").innerHTML=ms.length?ms.map(i=>`<li><span><time class="dt">${fd(i.date)}</time><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>${i.context?`<br><span class="sub">${esc(i.context)}</span>`:""}</span><span class="dom">${esc(i.publisher)}</span></li>`).join(""):'<li class="dom">Nothing here yet.</li>';
 $("upd").textContent=`${ws.length} articles · ${vs.length} talks & podcasts · ${ms.length} mentions`;
 $("tags").onclick=e=>{const k=e.target.dataset.k;if(k!=null){tag=k;arts()}};$("arts").onclick=e=>{const t=e.target.dataset.t;if(t){tag=tag==t?"":t;arts();$("q").scrollIntoView({block:"start"})}};$("kinds").onclick=e=>{const k=e.target.dataset.k;if(k!=null){kind=k;vids()}};$("q").oninput=arts;arts();vids();});
</script></body></html>
